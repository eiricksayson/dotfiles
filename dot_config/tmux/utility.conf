# Display lazygit
bind -r g display-popup -d '#{pane_current_path}' -w80% -h80% -E lazygit

# Display neovim
bind -r v display-popup -d '#{pane_current_path}' -w95% -h95% -E nvim

# Display a shell in the current directory
bind -r s display-popup -d '#{pane_current_path}' -w85% -h85% -E "$SHELL"

# Session switching
bind -r N switch-client -n
bind -r P switch-client -p
bind -r Tab switch-client -l

# Toggle to last-used window (lowercase l is taken by pain-control for pane nav)
bind -r Space last-window
